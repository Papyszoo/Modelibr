services:
    nginx:
        image: ${DOCKER_REGISTRY-}nginx-proxy
        build:
            context: ./nginx
            dockerfile: Dockerfile
        container_name: nginx-proxy
        ports:
            - "${FRONTEND_PORT:-3010}:443"
            # Remove WEBDAV_HTTPS_PORT or WEBDAV_HTTP_PORT from .env to disable that port.
            - "${WEBDAV_HTTPS_PORT}:443"
            - "${WEBDAV_HTTP_PORT}:80"
        volumes:
            - ./data/certs:/etc/nginx/certs
        depends_on:
            - frontend
            - webapi
        networks:
            - modelibr
        restart: unless-stopped
    webapi:
        image: ${DOCKER_REGISTRY-}webapi
        build:
            context: .
            dockerfile: src/WebApi/Dockerfile
            args:
                APP_UID: ${HOST_UID:-1000}
                APP_GID: ${HOST_GID:-1000}
        container_name: webapi
        environment:
            - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
            - WORKER_API_KEY=${WORKER_API_KEY:-}
            - UPLOAD_STORAGE_PATH=/var/lib/modelibr/uploads
            - BACKUP_STORAGE_PATH=/var/lib/modelibr/backups
            - RESTORE_STORAGE_PATH=/var/lib/modelibr/restore
            - THUMBNAIL_STORAGE_PATH=/var/lib/modelibr/thumbnails
            - POSTGRES_HOST=postgres
            - POSTGRES_PORT=5432
            - POSTGRES_DB=Modelibr
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - ConnectionStrings__Default=Host=postgres;Port=5432;Database=Modelibr;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};
            - MODELIBR_SKIP_PREMIGRATION_BACKUP=${MODELIBR_SKIP_PREMIGRATION_BACKUP:-false}
            - MODELIBR_PREMIGRATION_BACKUP_RETENTION=${MODELIBR_PREMIGRATION_BACKUP_RETENTION:-3}
            - DisableHttpsRedirection=true
            - HTTPS_PORT=${HTTPS_PORT:-8443}
            - EXPOSE_443_PORT=${EXPOSE_443_PORT:-true}
            - WEBDAV_HTTPS_PORT=${WEBDAV_HTTPS_PORT}
            - WEBDAV_HTTP_PORT=${WEBDAV_HTTP_PORT}
            # reduce verbosity: only warnings and above
            - ASPNETCORE_LOGGING__LOGLEVEL__DEFAULT=Warning
            - ASPNETCORE_LOGGING__LOGLEVEL__Microsoft=Warning
            - BLENDER_INSTALL_PATH=${BLENDER_INSTALL_PATH:-/var/lib/modelibr/blender}
            # Local MCP agent server. Reads are on by default; writes are a
            # deliberate opt-in because the endpoint shares the Web API's exposure.
            # Every MCP_* variable in .env.example must be forwarded here: the
            # container sees only what this list names, so a missing row silently
            # runs the endpoint with that setting's default. MCP_TOKENS defaulting
            # to unset is what "unauthenticated" means, and this port is published.
            - MCP_ENABLED=${MCP_ENABLED:-true}
            - MCP_WRITE_ENABLED=${MCP_WRITE_ENABLED:-false}
            - MCP_DESTRUCTIVE_ENABLED=${MCP_DESTRUCTIVE_ENABLED:-false}
            - MCP_TOKENS=${MCP_TOKENS:-}
            # The Asset Store the MCP store tools read. Unset here and the container
            # cannot see the store at all, whatever the browser's VITE_STORE_URL says -
            # they are two different clients on two different sides.
            - STORE_URL=${STORE_URL:-}
            - STORE_CATALOG_HTTP_TIMEOUT_SECONDS=${STORE_CATALOG_HTTP_TIMEOUT_SECONDS:-10}
        ports:
            - "${HTTPS_PORT:-8443}:${HTTPS_PORT:-8443}"
        volumes:
            # Use platform-appropriate secret/cert paths; on macOS $HOME works (APPDATA is Windows-specific)
            - ${HOME}/.microsoft/usersecrets:/home/app/.microsoft/usersecrets:ro
            - ${HOME}/.aspnet/https:/home/app/.aspnet/https:ro
            - ./data/uploads:/var/lib/modelibr/uploads
            - ./data/backups:/var/lib/modelibr/backups
            - ./data/restore:/var/lib/modelibr/restore
            - ./data/thumbnails:/var/lib/modelibr/thumbnails
            - blender-data:/var/lib/modelibr/blender
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - modelibr
    frontend:
        image: ${DOCKER_REGISTRY-}frontend
        build:
            context: ./src/frontend
            dockerfile: Dockerfile
            target: production
            additional_contexts:
                # The frontend imports the shared TIFF decoder from the
                # asset-processor workspace so both interpret TIFFs identically.
                asset-processor: ./src/asset-processor
            args:
                VITE_API_BASE_URL: ${VITE_API_BASE_URL}
                # `-` and not `:-`: an explicitly EMPTY VITE_STORE_URL means "no
                # store", and the Asset Store tab renders its unconfigured state.
                # With `:-` the empty value fell through to the hosted default,
                # so opting out of the online surface silently opted back in.
                VITE_STORE_URL: ${VITE_STORE_URL-https://store.modelibr.com}
        container_name: frontend
        networks:
            - modelibr
    asset-processor:
        image: ${DOCKER_REGISTRY-}asset-processor
        build:
            context: ./src/asset-processor
            dockerfile: Dockerfile
        container_name: asset-processor
        environment:
            - WORKER_ID=${WORKER_ID:-worker-1}
            - WORKER_PORT=${WORKER_PORT:-3001}
            - API_BASE_URL=https://webapi:${HTTPS_PORT:-8443}
            # Scene render-back photographs the running app, so the worker needs
            # the frontend's address as well as the API's. Container-internal:
            # the browser runs inside this container, not on the host.
            - FRONTEND_URL=${WORKER_FRONTEND_URL:-http://frontend:80}
            - WORKER_API_KEY=${WORKER_API_KEY:-}
            - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-3}
            - EXTRACTION_POLL_INTERVAL_MS=${EXTRACTION_POLL_INTERVAL_MS:-5000}
            - EXTRACTION_CONCURRENCY=${EXTRACTION_CONCURRENCY:-3}
            - EXTRACTION_BATCH_SIZE=${EXTRACTION_BATCH_SIZE:-30}
            # Blender operations (UV unwrap, bake) poll their own family and run one at
            # a time. Forwarded so the values documented in .env.example actually reach
            # the worker - they had no effect in compose before.
            - BLENDER_POLL_INTERVAL_MS=${BLENDER_POLL_INTERVAL_MS:-10000}
            - BLENDER_OPERATION_TIMEOUT_MS=${BLENDER_OPERATION_TIMEOUT_MS:-900000}
            - RENDER_WIDTH=${RENDER_WIDTH:-256}
            - RENDER_HEIGHT=${RENDER_HEIGHT:-256}
            - RENDER_FORMAT=${RENDER_FORMAT:-png}
            - LOG_LEVEL=${LOG_LEVEL:-info}
            # Required for the self-signed API certificate; do NOT use in production
            # with external TLS. It governs BOTH this process's requests and, through
            # config.rejectUnauthorized, the headless browser the scene renderer drives -
            # Chromium validates certificates itself and ignores Node's setting, so the
            # scene render page could not reach the API over HTTPS without it.
            - NODE_TLS_REJECT_UNAUTHORIZED=0
            - THUMBNAIL_STORAGE_PATH=/var/lib/modelibr/thumbnails
        ports:
            - "${WORKER_PORT:-3001}:3001"
        volumes:
            - ./data/thumbnails:/var/lib/modelibr/thumbnails
            - blender-data:/var/lib/modelibr/blender
        depends_on:
            - webapi
        networks:
            - modelibr
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    memory: 4G
    postgres:
        image: postgres:16-alpine
        container_name: postgres
        environment:
            POSTGRES_DB: Modelibr
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        ports:
            - "${POSTGRES_PORT}:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d Modelibr"]
            interval: 15s
            timeout: 5s
            retries: 10
            start_period: 20s
        volumes:
            - ./data/postgres:/var/lib/postgresql/data
        networks:
            - modelibr

networks:
    modelibr:
        driver: bridge

volumes:
    # Shared volume for dynamically downloaded Blender binaries.
    # Mounted in both webapi (writes) and asset-processor (reads/executes).
    blender-data:
