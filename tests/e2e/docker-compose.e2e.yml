services:
    webapi-e2e:
        build:
            context: ../../
            dockerfile: src/WebApi/Dockerfile
        container_name: webapi-e2e
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
            - ASPNETCORE_HTTP_PORTS=8080
            - UPLOAD_STORAGE_PATH=/var/lib/modelibr/uploads
            - ConnectionStrings__Default=Host=postgres-e2e;Port=5432;Database=Modelibr;Username=modelibr;Password=e2e_password;
            - DisableHttpsRedirection=true
            - AllowedOrigins__0=http://localhost:3002
            - AllowedOrigins__1=http://localhost:3010
            - BLENDER_INSTALL_PATH=/var/lib/modelibr/blender
            # The store address is a build constant now, so the e2e stack points the
            # backend at its local fixture through the test-only override (never
            # documented user config). The fixture shares this container's network
            # namespace (see store-fixture-e2e), so loopback reaches it; http: is
            # allowed because the host is localhost. The browser side is mapped to
            # the same fixture's TLS listener by the Playwright host-resolver rule.
            - MODELIBR_STORE_BASE_URL_OVERRIDE=http://localhost:9280
            # This stack recreates its DB fresh every run, so first boot always has
            # every migration pending. It has no backup configuration (no POSTGRES_*
            # env / BACKUP_STORAGE_PATH), so the pre-migration backup cannot run here
            # and would abort startup by design. The pre-migration path itself is
            # covered by backup-restore-e2e spec 06 + the DatabaseExtensions
            # integration tests.
            - MODELIBR_SKIP_PREMIGRATION_BACKUP=true
            # The agent write tools (add_to_project, add_project_comment, ...) are
            # opt-in and off in a stock server. The project features that exist
            # only for agents are covered through them, so this stack turns them
            # on. No tokens are configured, so the endpoint stays unauthenticated
            # like the rest of this throwaway stack.
            - MCP_WRITE_ENABLED=true
        ports:
            - "8090:8080"
            # Published for store-fixture-e2e, which shares this container's
            # network namespace (see that service for why). 9280 is the backend's
            # plain-http fixture; 9443 is the same fixture over TLS, which the
            # browser reaches as the store's https origin.
            - "9280:9280"
            - "9443:9443"
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
            interval: 5s
            timeout: 5s
            retries: 10
        volumes:
            - webapi-uploads:/var/lib/modelibr/uploads
            - blender-data:/var/lib/modelibr/blender
        depends_on:
            postgres-e2e:
                condition: service_healthy
        networks:
            - modelibr-e2e
    # Stand-in for the companion Asset Store (fixtures/store-fixture). It
    # shares webapi-e2e's network namespace so it is reachable both as
    # http://localhost:9280 (the backend importer, via the
    # MODELIBR_STORE_BASE_URL_OVERRIDE test seam) and, over TLS on 9443, as
    # https://store.modelibr.com (the browser, via the Playwright host-resolver
    # rule). Manifest download URLs must be same-ORIGIN - scheme included - to
    # carry the import token.
    store-fixture-e2e:
        build:
            context: .
            dockerfile: fixtures/store-fixture/Dockerfile
        container_name: store-fixture-e2e
        network_mode: "service:webapi-e2e"
        environment:
            # Serve TLS alongside the plain-http fixture so the browser can talk
            # to the store's real https origin (mapped here by the Playwright
            # config's host-resolver rule). Cert is generated at image build.
            - TLS_PORT=9443
            - TLS_CERT=/app/server.crt
            - TLS_KEY=/app/server.key
        depends_on:
            webapi-e2e:
                condition: service_started
    frontend-e2e:
        build:
            context: ../../src/frontend
            dockerfile: Dockerfile
            target: production
            additional_contexts:
                # The frontend imports the shared TIFF decoder from the
                # asset-processor workspace so both interpret TIFFs identically.
                asset-processor: ../../src/asset-processor
            args:
                VITE_API_BASE_URL: http://localhost:8090
        container_name: frontend-e2e
        ports:
            - "3002:80"
        networks:
            - modelibr-e2e
    asset-processor-e2e:
        build:
            context: ../../src/asset-processor
            dockerfile: Dockerfile
        container_name: asset-processor-e2e
        # A dead worker used to poison the whole run: nothing restarted it and no
        # scenario noticed, so every later thumbnail wait burned its full timeout
        # (2026-08-10: the worker died 14 min in, e2e-full took 102 min instead of
        # 18 and lost 3 scenarios). on-failure - not unless-stopped - so a clean
        # `compose down` still stops it and an interrupted run leaves nothing to
        # resurrect on the next daemon start. A restart is never silent: hooks.ts
        # attaches RestartCount to every failing test.
        restart: on-failure:5
        environment:
            - WORKER_ID=worker-e2e
            - WORKER_PORT=3001
            - API_BASE_URL=http://webapi-e2e:8080
            # Scene render-back drives the app in a headless browser inside this
            # container, so this is the compose service - not the host's :3002.
            - FRONTEND_URL=http://frontend-e2e:80
            - MAX_CONCURRENT_JOBS=3
            - RENDER_WIDTH=256
            - RENDER_HEIGHT=256
            - RENDER_FORMAT=png
            - LOG_LEVEL=info
            - THUMBNAIL_STORAGE_PATH=/var/lib/modelibr/thumbnails
            - POLL_INTERVAL_MS=2000
        ports:
            - "3003:3001"
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
            interval: 5s
            timeout: 5s
            retries: 10
        volumes:
            - worker-thumbnails:/var/lib/modelibr/thumbnails
            - blender-data:/var/lib/modelibr/blender
        depends_on:
            webapi-e2e:
                condition: service_healthy
        networks:
            - modelibr-e2e
    postgres-e2e:
        image: postgres:16-alpine
        container_name: postgres-e2e
        environment:
            POSTGRES_DB: Modelibr
            POSTGRES_USER: modelibr
            POSTGRES_PASSWORD: e2e_password
        ports:
            - "5433:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U modelibr -d Modelibr"]
            interval: 5s
            timeout: 5s
            retries: 10
        volumes:
            - postgres-data:/var/lib/postgresql/data
        networks:
            - modelibr-e2e

networks:
    modelibr-e2e:
        driver: bridge

volumes:
    webapi-uploads:
    worker-thumbnails:
    postgres-data:
    blender-data:
