name: Docker Publish

on:
    workflow_run:
        workflows: ["CI and Build Docs"]
        types: [completed]
        branches: [main]

permissions:
    contents: read
    packages: write
    # Needed to read the triggering run's job list in the gate below.
    actions: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Publishing used to require the WHOLE "CI and Build Docs" run to succeed,
    # which meant a documentation artifact could veto an image build: the
    # GPU-dependent docs videos cannot render reliably on GitHub's GPU-less
    # runners, and a red video lane fails build-docs -> skips deploy-docs ->
    # skips this workflow. There is no manual trigger here, so the images simply
    # never shipped - that is what cost 0.4.0, 0.4.1, 0.4.2 and 0.5.0 their
    # Docker images.
    #
    # Gate on the "CI Status" job of the triggering run instead. That job already
    # aggregates exactly the code-correctness lanes (backend, frontend,
    # asset-processor, e2e) and deliberately excludes videos and docs, so the
    # images are still gated on every test that says the code works - and on
    # nothing that merely says a screencast rendered. Verified against the v0.5.0
    # main push, where "CI Status" was success while the run overall was failure.
    gate:
        name: Check code-correctness lanes
        runs-on: ubuntu-latest
        if: >-
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.conclusion != 'cancelled'
        outputs:
            ok: ${{ steps.check.outputs.ok }}
        steps:
            - name: Resolve CI Status conclusion
              id: check
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RUN_ID: ${{ github.event.workflow_run.id }}
              run: |
                  conclusion=$(gh api --paginate \
                    "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" \
                    --jq '[.jobs[] | select(.name == "CI Status") | .conclusion] | first // "missing"')
                  echo "CI Status -> ${conclusion}"
                  if [ "${conclusion}" = "success" ]; then
                    echo "ok=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "ok=false" >> "$GITHUB_OUTPUT"
                    echo "::warning::Skipping Docker publish - CI Status was '${conclusion}', not success."
                  fi

    docker-publish:
        name: Build and Publish Docker Images
        runs-on: ubuntu-latest
        needs: [gate]
        if: needs.gate.outputs.ok == 'true'

        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}

            - name: Compute tags
              id: vars
              shell: bash
              run: |
                  SHA="${{ github.event.workflow_run.head_sha }}"
                  echo "sha_short=${SHA::7}" >> "$GITHUB_OUTPUT"
                  echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
                  # This workflow only ever runs for main, and main only advances
                  # at a release, so the checked-out version is the released one.
                  # Without this the images carried no version tag at all and a
                  # self-hoster had nothing to pin to - only the rolling :dev.
                  echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push modelibr-frontend
              uses: docker/build-push-action@v6
              with:
                  context: ./src/frontend
                  file: ./src/frontend/Dockerfile
                  push: true
                  tags: |
                      ghcr.io/${{ steps.vars.outputs.owner_lc }}/modelibr-frontend:dev
                      ghcr.io/${{ steps.vars.outputs.owner_lc }}/modelibr-frontend:dev-sha-${{ steps.vars.outputs.sha_short }}
                      ghcr.io/${{ steps.vars.outputs.owner_lc }}/modelibr-frontend:${{ steps.vars.outputs.version }}

            - name: Build and push modelibr-webapi
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./src/WebApi/Dockerfile
                  push: true
                  tags: |
                      ghcr.io/${{ steps.vars.outputs.owner_lc }}/modelibr-webapi:dev
                      ghcr.io/${{ steps.vars.outputs.owner_lc }}/modelibr-webapi:dev-sha-${{ steps.vars.outputs.sha_short }}
                      ghcr.io/${{ steps.vars.outputs.owner_lc }}/modelibr-webapi:${{ steps.vars.outputs.version }}

            - name: Build and push modelibr-asset-processor
              uses: docker/build-push-action@v6
              with:
                  context: ./src/asset-processor
                  file: ./src/asset-processor/Dockerfile
                  push: true
                  tags: |
                      ghcr.io/${{ steps.vars.outputs.owner_lc }}/modelibr-asset-processor:dev
                      ghcr.io/${{ steps.vars.outputs.owner_lc }}/modelibr-asset-processor:dev-sha-${{ steps.vars.outputs.sha_short }}
                      ghcr.io/${{ steps.vars.outputs.owner_lc }}/modelibr-asset-processor:${{ steps.vars.outputs.version }}
